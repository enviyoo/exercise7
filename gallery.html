<!DOCTYPE html>
<html lang="eng-ca">
  <head>
    <meta charset="UTF-8">
    <title>Exercise 7: Typography</title>
    <!--Created by Emma Wang on April 6, 2026 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      .main {
        width: 1200px;
        margin: 0 auto;
        padding-bottom: 10px;
      }

      .container {
        display: grid;
        grid-template-columns: 50% 50%;
        padding: 10px;
        gap: 60px;
      }

      .left {
        padding: 0px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        font-size: 20px;
        text-align: left;
      }

      .right {
        padding: 0px;

        font-size: 20px;
        text-align: left;
      }

      .section {
        padding: 80px 0;
      }

      .bottom-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .image-row {
        display: flex;
        justify-content: center;
        gap: 90px;
        margin-bottom: 10px;
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }



      h1 {
        font-family: "Onest", Comic Sans MS, cursive;
        font-size: 3em;
        font-weight: 800;
        letter-spacing: auto;
        color: #4C4E54;
        margin-bottom: 0px;
      }

      h2 {
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 1.4em;
        font-weight: bold;
        color: #E48E99;
      }

      h3 {
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 1.1em;
        font-weight: 600;
        color: #E48E99;
        margin-bottom: 0px;
      }

      h4 {
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 1.3em;
        font-weight: bold;
        color: darkolivegreen;
      }

      ul {
        font-family: "Open Sans", Arial, sans-serif;
        text-align: left;
        font-size: 1em;
        line-height: 1.4;
      }

      p {
        line-height: 1.5;
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 1em;
        margin: 15px 0px;
      }

      img {
        display: block;
        transition: transform 0.2s ease;
      }

      body {
        background-image: url("background-grid.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }




      .item img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        transition: transform 0.2s ease;

      }

      .item img:hover {
        transform: translateY(-8px);
      }

      .item p {
        margin-top: 10px;
        width: 200px;
      }

      .nav {
        text-align: center;
        padding: 20px;
      }

      .nav a {
        text-decoration: none;
        color: #4C4E54;
        font-family: 'Poppins', sans-serif;
        font-weight: bold;
        font-size: 1.3em;
        display: inline-block;
        margin: 0 35px;
        transition: color 0.3s ease;
      }

      .nav a:hover {
        color: #E48E99;
      }

      .nav a.active {
        color: #E48E99;
      }

      .textcolour1 {
        color: #4C4E54;
      }

      .textcolour2 {
        color: #E48E99;
      }

      .footer {
        text-align: center;
        margin-top: 40px;
        padding-bottom: 0px;
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 0.9em;
        color: #4C4E54;
      }

      .sticker1 {
        position: absolute;
        top: 270px;
        left: 1260px;
        transform: rotate(10deg);
      }

      .sticker2 {
        position: absolute;
        top: 220px;
        left: 1360px;
        transform: rotate(10deg);
      }

      .polaroid {
        position: relative;
        width: 80%;
        transition: transform 0.3s ease;
      }

      .polaroid:hover {
        transform: rotate(3deg);
      }

      .frame {
        width: 100%;
        display: block;
      }

      .photo {
        position: absolute;
        top: 5%;
        left: 5%;
        width: 90%;
      }

      .toolbox {
        color: #4C4E54;
        margin-bottom: 40px;
      }

      /* gallery title */
      .gallery-title {
        color: #E48E99;
        text-align: center;
        margin-bottom: 40px;
      }

      /* featured images (top big ones) */
      .featured {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        margin-bottom: 60px;
      }

      .featured img {
        width: 80%;
        max-width: 900px;
        border-radius: 6px;
      }

      /* grid gallery (2x2 squares) */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 60px;
        width: 80%;
        margin: 0 auto 60px auto;
      }

      .gallery-grid img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      /* bottom wide image */
      .wide {
        display: flex;
        justify-content: center;
      }

      .wide img {
        width: 80%;
        height: 250px;
        object-fit: cover;
      }

      /* hover effect (matches your style) */
      .featured img:hover,
      .gallery-grid img:hover,
      .wide img:hover {
        transform: translateY(-8px);
      }
    </style>


  </head>
  <body>
    <nav class="nav">
      <a href="index.html">home</a>
      <a href="about.html">about</a>
      <a href="gallery.html" class="active">gallery</a>
      <a href="commission.html">commission</a>
      <a href="contact.html">contact</a>
    </nav>
    <div class="main">
      <div class="section">
        <div class="bottom-content">
        <!-- AI assisted using ChatGPT. Prompt: "How do I create a gallery in HTML/CSS?" -->
          <h1 class="gallery-title">my artworks!</h1>

          <!-- featured images -->
          <div class="featured">
            <img src="illustration1.png" alt="">
            <img src="art2.jpg" alt="">
          </div>

          <!-- gallery grid -->
          <div class="gallery-grid">
            <img src="art3.jpg" alt="">
            <img src="art4.jpg" alt="">
            <img src="art5.jpg" alt="">
            <img src="art6.jpg" alt="">
          </div>

          <!-- wide image -->
          <div class="wide">
            <img src="art7.jpg" alt="">
          </div>

        </div>
      </div>
    </div>
    <footer class="footer">
      <p>
        2026 © enviyu<br>
        characters displayed on fanart work belong to their respective owners.
      </p>
    </footer>
  </body>

</html>
